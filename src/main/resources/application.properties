spring.application.name=keyboard_project

# Server Port
server.port=8080

# 비밀 설정(DB 계정, JWT 비밀키)은 각자 application-secret.properties에 작성 (깃허브에 올리지 않음)
spring.config.import=optional:classpath:application-secret.properties

# 로컬 전액 취소는 테스트 플래그를 명시한 실행에서만 사용합니다.
toss.payments.test.enabled=${TOSS_PAYMENTS_TEST_ENABLED:false}
toss.payments.test.full-cancel-enabled=${TOSS_PAYMENTS_TEST_FULL_CANCEL_ENABLED:false}

# JWT 만료 시간 (밀리초) - Access 1시간, Refresh 7일
jwt.access-expiration=3600000
jwt.refresh-expiration=604800000

# 프론트 주소 (CORS 허용)
cors.allowed-origin=http://localhost:3000

# JPA / Hibernate Settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AWS RDS HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
