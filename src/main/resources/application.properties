spring.application.name=keyboard_project
spring.datasource.url=jdbc:mysql://localhost:3306/keyboard_shop?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
# Explicit opt-in; disabled tests do not read or validate a secret key.
toss.payments.test.enabled=${TOSS_PAYMENTS_TEST_ENABLED:false}

# Development-only payment confirmation, disabled by default.
toss.payments.dev-confirm.enabled=${TOSS_PAYMENTS_DEV_CONFIRM_ENABLED:false}
toss.payments.confirm.read-timeout-seconds=65
cors.allowed-origin=http://localhost:3000
