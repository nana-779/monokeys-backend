spring.application.name=keyboard_project

# Server Port
server.port=8080

# 비밀/로컬 접속 정보 import (application-secret.properties가 있으면 로드, 없어도 optional이라 에러 안 남)
spring.config.import=optional:classpath:application-secret.properties

# 기본 DataSource fallback (환경변수나 secret 파일이 없을 경우 대비)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/keyboard_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
