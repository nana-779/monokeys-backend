spring.application.name=keyboard_project
spring.config.import=optional:classpath:application-secret.properties
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
# Shared login settings from the approved member integration guide.
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
